[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dehesa-crown-segmentation"
version = "0.1.0"
description = "Tree crown detection over orthophotos with a YOLOv11 segmentation model"
authors = [{ name = "Juan Manuel Herruzo", email = "juanmherruzo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
# torch / torchvision are pulled in transitively by ultralytics. For CUDA builds
# install them separately from the PyTorch index (see README).
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "ultralytics>=8.4.34,<9.0.0",
    "rasterio>=1.3.0,<2.0.0",
    "geopandas>=0.14.0,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "black>=24.0.0,<26.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
crown-detect = "crown_detector.cli:main"
crown-indices = "crown_detector.indices:main"

[project.urls]
Repository = "https://github.com/Juanmaherruzo/Dehesa-Crown-Segmentation-YOLOv11"

[tool.setuptools.packages.find]
where = ["."]
include = ["crown_detector*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# numpy's current stubs use PEP 695 `type` statements that mypy only parses
# under python_version >= 3.12; skip following them (treated as Any).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
